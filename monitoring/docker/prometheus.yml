# Local-dev Prometheus config (docker-compose only). No Kubernetes service
# discovery here -- just static targets by Compose service name, since
# Compose's built-in DNS resolves service names to the right container.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: k8s-api
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]

  - job_name: k8s-api-worker
    # backup_duration_seconds (backups/metrics.py), served by the HTTP
    # server k8s_api/celery.py starts on worker_init -- see docker-compose.yml.
    static_configs:
      - targets: ["worker:9808"]

  - job_name: redis
    # redis_exporter serves on /metrics by default -- no metrics_path override needed.
    static_configs:
      - targets: ["redis-exporter:9121"]
