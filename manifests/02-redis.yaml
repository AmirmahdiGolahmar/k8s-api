apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: k8s-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Redis has no memory ceiling by default -- it'll grow until the
          # container's memory limit kills it. --maxmemory caps it below
          # that limit so Redis itself starts rejecting writes (visible,
          # recoverable) instead of the kernel OOM-killing the process
          # (silent, loses in-flight task state). noeviction is right for
          # a Celery broker/result-backend -- silently dropping keys under
          # an LRU policy would just relocate the failure somewhere worse.
          args:
            - redis-server
            - --maxmemory
            - "96mb"
            - --maxmemory-policy
            - noeviction
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  # Name must match CELERY_BROKER_URL / CELERY_RESULT_BACKEND in
  # k8s-api-secrets (redis://k8s-api-redis:6379/...).
  name: k8s-api-redis
  namespace: k8s-api
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
