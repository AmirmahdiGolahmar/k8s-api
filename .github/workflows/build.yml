name: Build and push image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ghcr.io requires a lowercase repo path -- the GitHub username
          # here ("AmirmahdiGolahmar") isn't, so it's hardcoded lowercase
          # rather than derived from ${{ github.repository }}.
          tags: |
            ghcr.io/amirmahdigolahmar/k8s-api:latest
            ghcr.io/amirmahdigolahmar/k8s-api:${{ github.sha }}
