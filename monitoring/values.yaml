# Values for prometheus-community/kube-prometheus-stack, chart version 88.6.2
# (pinned deliberately -- see monitoring/README.md for the exact install
# command). Every key below was checked against that exact chart version's
# packaged values.yaml / subchart values.yaml before being used here.
#
# This cluster is small (2 nodes, 2 vCPU / ~2GB RAM each, already running at
# 55-62% memory before any of this) and Prometheus/node-exporter/etc. carry
# no resource requests or limits at all unless set explicitly here -- so
# every component below gets an explicit, deliberately conservative
# resources block. Nothing is left to chart defaults for that reason.

# ---------------------------------------------------------------------------
# Prometheus Operator: reconciles the CRDs (Prometheus, Alertmanager,
# ServiceMonitor, ...) into actual Deployments/StatefulSets. Small, constant
# workload regardless of cluster size.
# ---------------------------------------------------------------------------
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

# ---------------------------------------------------------------------------
# Prometheus itself: the scraper + time-series database. The biggest memory
# consumer of the stack (it holds recent samples in memory), so it gets the
# largest budget here -- but still capped well under this cluster's headroom.
# ---------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    resources:
      requests: { cpu: 150m, memory: 300Mi }
      limits: { cpu: 500m, memory: 512Mi }

    # Disk isn't the constraint on this cluster (28GB free per node, 0%
    # DiskPressure) -- memory is. retention/retentionSize are set low
    # anyway so a small PVC is enough and Prometheus doesn't hold more
    # history than this cluster's RAM budget can realistically query well.
    retention: 5d
    retentionSize: "4GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

    # The chart's default (*SelectorNilUsesHelmValues: true) restricts
    # Prometheus to only ServiceMonitors/PodMonitors/PrometheusRules that
    # carry this Helm release's own label. Our ServiceMonitors for the
    # k8s-api app and redis-exporter live in the k8s-api namespace, applied
    # as plain manifests with no such label -- without setting these false,
    # Prometheus would silently ignore them.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

# ---------------------------------------------------------------------------
# Alertmanager: default node-down/disk/memory-pressure rules only for now,
# no external notification channel configured yet (no Slack/email wired up
# -- see monitoring/README.md for how to add one later). Storage
# deliberately left at the chart default (no volumeClaimTemplate => ephemeral)
# -- losing alert-dedup state on a restart is a low-stakes tradeoff here,
# not worth a fourth PVC on a disk-unconstrained-but-memory-tight cluster.
# ---------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { cpu: 100m, memory: 64Mi }

# ---------------------------------------------------------------------------
# Grafana: dashboards UI. Ingress is deliberately OFF here -- exposed via a
# hand-written Ingress manifest instead (monitoring/, added in a later step)
# so it follows this repo's existing Traefik-priority-annotation convention
# rather than the chart's generic ingress template.
# ---------------------------------------------------------------------------
grafana:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

  ingress:
    enabled: false

  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes: ["ReadWriteOnce"]
    size: 2Gi

  # Never put a real password in this file (it's committed to the repo).
  # This Secret is created imperatively via kubectl before the chart is
  # installed -- see monitoring/README.md -- and referenced here by name
  # only; the plaintext password never appears in git or in this session's
  # own command history.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  sidecar:
    dashboards:
      # Default is already true -- kept explicit since our custom k8s-api
      # dashboard (a later step) depends on this: any ConfigMap labeled
      # grafana_dashboard: "1" in this namespace is auto-loaded, no manual
      # import needed.
      enabled: true

# ---------------------------------------------------------------------------
# kube-state-metrics: translates the k8s API's object state (Deployment
# replica counts, Pod phase, etc.) into /metrics. Cheap on a cluster this
# small (a handful of namespaces/objects).
# ---------------------------------------------------------------------------
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

# ---------------------------------------------------------------------------
# node-exporter: DaemonSet, one Pod per node (so this budget is *per node*,
# not cluster-wide). Translates OS-level stats (CPU/mem/disk/net) to
# /metrics. Very lightweight by design.
# ---------------------------------------------------------------------------
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 50m, memory: 32Mi }
