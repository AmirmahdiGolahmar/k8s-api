apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: k8s-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  # Name must match CELERY_BROKER_URL / CELERY_RESULT_BACKEND in
  # k8s-api-secrets (redis://k8s-api-redis:6379/...).
  name: k8s-api-redis
  namespace: k8s-api
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
