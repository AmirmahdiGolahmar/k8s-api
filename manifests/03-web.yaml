apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-api
spec:
  replicas: 1
  # Two Pods can't both hold the k8s-api-data PVC (ReadWriteOnce) --
  # Recreate fully stops the old Pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: migrate
          image: ghcr.io/amirmahdigolahmar/k8s-api:latest
          command: ["python", "manage.py", "migrate"]
          envFrom:
            - secretRef: { name: k8s-api-secrets }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
      containers:
        - name: web
          image: ghcr.io/amirmahdigolahmar/k8s-api:latest
          envFrom:
            - secretRef: { name: k8s-api-secrets }
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 8000
          # Host header override: kubelet probes the Pod's internal IP
          # directly, but ALLOWED_HOSTS only permits golahmar.osdl.ir --
          # without this, Django 400s the probe itself and the Pod never
          # becomes Ready.
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8000
              httpHeaders:
                - name: Host
                  value: golahmar.osdl.ir
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
              httpHeaders:
                - name: Host
                  value: golahmar.osdl.ir
            initialDelaySeconds: 15
            periodSeconds: 20
          # gunicorn --workers 3 (Dockerfile's CMD): master + 3 sync
          # workers, each a full Django/DRF process. ~300Mi covers steady
          # state; 600Mi limit leaves room for a spike (e.g. /schema's
          # OpenAPI generation) without threatening the rest of the VM.
          resources:
            requests: { cpu: 150m, memory: 300Mi }
            limits: { cpu: 500m, memory: 600Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k8s-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: k8s-api
  # VMServiceScrape (monitoring/10-vmservicescrapes.yaml) selects on this.
  labels: { app: web }
spec:
  selector: { app: web }
  ports:
    # Named so the VMServiceScrape endpoint can reference it by name
    # instead of a bare port number.
    - name: http
      port: 80
      targetPort: 8000
